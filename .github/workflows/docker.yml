name: Docker Build

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Build backend image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Build backend
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.4.0
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: openkrishi-ai-api:ci

  frontend:
    name: Build frontend image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Buildx
        uses: docker/setup-buildx-action@37fe631d7c4c1f0f7b6a8d0f0e6e4a1a2d8d4a31 # v4.3.0
      - name: Build frontend
        uses: docker/build-push-action@c3c9e26b7d0f4bfc4b0a0f1a4f9d6a2b9c4f5d6 # v7.4.0
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: false
          tags: openkrishi-ai-pwa:ci
