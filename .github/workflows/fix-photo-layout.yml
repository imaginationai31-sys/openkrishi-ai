name: Fix Photo Layout

on:
  push:
    paths:
      - frontend/index.html
      - .github/workflows/fix-photo-layout.yml

permissions:
  contents: write

jobs:
  fix-layout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore forecast and mobile photo layout
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('frontend/index.html')
          s = p.read_text(encoding='utf-8')
          s = s.replace('.forecast{display:grid;grid-template-columns:repeat(2,1fr)', '.forecast{display:grid;grid-template-columns:repeat(3,1fr)')
          s = s.replace('@media(max-width:430px){.photo-actions{grid-template-columns:1fr}', '@media(max-width:430px){.photo-actions{grid-template-columns:repeat(2,1fr)')
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/index.html
          git rm .github/workflows/fix-photo-layout.yml
          git commit -m "fix: restore photo and forecast layout"
          git push
