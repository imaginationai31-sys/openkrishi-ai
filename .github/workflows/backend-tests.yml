name: Backend Tests

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: uv.lock

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.19"
          enable-cache: true

      - name: Check lockfile consistency
        run: uv lock --check

      - name: Install dependencies
        run: uv sync --frozen --dev

      - name: Run lint
        run: |
          uv run ruff check services tests
          uv run ruff format --check services tests

      - name: Run Bandit security scan
        run: uvx --from bandit==1.8.6 bandit -r services -ll

      - name: Run dependency vulnerability audit
        run: uvx --from pip-audit==2.10.0 pip-audit --strict

      - name: Run tests
        env:
          PYTHONPATH: ${{ github.workspace }}
          CORS_ALLOW_ORIGINS: https://openkrishi-ai.hatchable.site
          OPENAI_API_KEY: test-openai-key
          SARVAM_API_KEY: test-sarvam-key
        run: uv run pytest --cov=services --cov-report=term-missing --cov-report=xml

      - name: Run typecheck
        run: uv run mypy services
