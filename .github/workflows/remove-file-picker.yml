name: Remove File Picker

on:
  push:
    paths:
      - frontend/index.html
      - .github/workflows/remove-file-picker.yml

permissions:
  contents: write

jobs:
  remove-file-picker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Remove file picker UI and logic
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('frontend/index.html')
          text = path.read_text(encoding='utf-8')

          text = text.replace('grid-template-columns:repeat(3,1fr)', 'grid-template-columns:repeat(2,1fr)')
          text = re.sub(r'\n<button id="fileButton"[^>]*></button>', '', text)
          text = re.sub(r'\n<input id="fileInput"[^>]*>', '', text)
          text = re.sub(r"\nfileButton=document\.getElementById\('fileButton'\),", '', text)
          text = re.sub(r"\nfileInput=document\.getElementById\('fileInput'\),", '', text)
          text = re.sub(r"\nfile:'[^']*',", '', text)
          text = text.replace('Use Direct Camera, Gallery, or File Picker', 'Use Direct Camera or Gallery')
          text = re.sub(r"\nfileButton\.addEventListener\([^;]+;", '', text)
          text = re.sub(r"\nfileInput\.addEventListener\('change',[\s\S]*?\n\}\);", '', text)

          path.write_text(text, encoding='utf-8')

          remaining = [x for x in ('fileButton', 'fileInput') if x in text]
          if remaining:
              raise SystemExit(f'Remaining file-picker references: {remaining}')
          print('File Picker removed successfully.')
          PY

      - name: Commit frontend change and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/index.html
          git rm .github/workflows/remove-file-picker.yml
          git commit -m "chore: remove file picker from frontend"
          git push
