name: Fresh Clone Verification

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Fresh clone build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout into clean directory
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: repo

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.12.19"
          enable-cache: true

      - name: Install backend
        working-directory: repo
        run: uv sync --frozen --dev

      - name: Run tests
        working-directory: repo
        env:
          PYTHONPATH: ${{ github.workspace }}/repo
          CORS_ALLOW_ORIGINS: http://localhost:8080
          OPENAI_API_KEY: test-openai-key
          SARVAM_API_KEY: test-sarvam-key
        run: uv run pytest --cov=services --cov-report=term-missing

      - name: Run lint
        working-directory: repo
        run: |
          uv run ruff check services tests
          uv run ruff format --check services tests

      - name: Run typecheck
        working-directory: repo
        run: uv run mypy services

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: repo/frontend/package-lock.json

      - name: Install frontend
        working-directory: repo/frontend
        run: npm ci

      - name: Run frontend lint
        working-directory: repo/frontend
        run: npm run lint

      - name: Run frontend typecheck
        working-directory: repo/frontend
        run: npm run typecheck

      - name: Run frontend tests
        working-directory: repo/frontend
        run: npm test

      - name: Build frontend
        working-directory: repo/frontend
        run: npm run build

      - name: Validate Docker Compose
        working-directory: repo
        run: docker compose config

      - name: Build Docker images
        working-directory: repo
        run: docker compose build

      - name: Start Docker stack
        working-directory: repo
        run: docker compose up -d

      - name: Verify container health
        working-directory: repo
        run: |
          sleep 10
          docker compose ps
          curl --fail http://127.0.0.1:8000/api/v1/health
          curl --fail http://127.0.0.1:8080/health

      - name: Stop Docker stack
        if: always()
        working-directory: repo
        run: docker compose down -v
