services:
  - type: web
    name: openkrishi-ai-api
    runtime: python
    buildCommand: pip install -r services/api/requirements.txt
    startCommand: uvicorn services.api.server:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/v1/health
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.8-flash
      - key: GEMINI_TRANSCRIBE_MODEL
        value: gemini-3.5-transcribe
      - key: GEMINI_TTS_MODEL
        value: gemini-3.1-flash-tts-preview
      - key: GEMINI_FALLBACK_TO_RULES
        value: "true"
      - key: GEMINI_ADVISORY_FALLBACK_MODEL
        value: gemini-3.6-flash
