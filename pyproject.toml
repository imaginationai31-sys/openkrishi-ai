[project]
name = "openkrishi-ai"
version = "0.1.0"
description = "Open-source multilingual AI agricultural advisory API."
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { file = "LICENSE" }
dependencies = [
  "fastapi==0.142.2",
  "uvicorn[standard]==0.54.0",
  "pydantic==2.13.5",
  "pydantic-settings==2.15.0",
  "httpx==0.28.1",
  "openai==3.22.1",
  "python-multipart==0.0.32",
  "slowapi==0.1.10",
]

[dependency-groups]
dev = [
  "pytest==9.1.1",
  "pytest-cov==7.1.0",
  "ruff==0.16.9",
  "mypy==1.18.2",
  "pre-commit==4.6.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"

[tool.coverage.run]
branch = true
source = ["services"]

[tool.coverage.report]
fail_under = 73
show_missing = true

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["apps/mobile"]

[tool.ruff.lint.isort]
known-first-party = ["services"]
lines-after-imports = 2

[tool.ruff.lint]
select = ["F", "I", "B", "UP", "TRY", "SIM", "S", "PT", "ASYNC", "RUF"]
ignore = ["B008", "TRY003"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.11"
follow_imports = "skip"
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
ignore_missing_imports = true
disallow_untyped_defs = false

[build-system]
requires = ["setuptools>=75,<85"]
build-backend = "setuptools.build_meta"
