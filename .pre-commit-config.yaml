repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.9
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v3.9.9
    hooks:
      - id: prettier
        files: ^frontend/(src|scripts)/.*\.(js|mjs)$
