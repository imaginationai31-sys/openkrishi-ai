<header>
<div class="logo">🌾</div>
<h1>OpenKrishi AI</h1>
<p id="tagline" class="tagline"></p>

<section class="card" id="weatherCard">

<div id="locationStatus" class="location-status"></div>
</div>
<button id="locationButton" class="location-button" type="button"></button>

<div id="weatherLoading" class="weather-loading" hidden></div>
<div id="weatherError" class="weather-error" hidden></div>

<div id="weatherContent" hidden>
<div class="weather-main">

<div id="temperatureLabel" class="weather-label"></div>
<div id="weatherTemperature" class="weather-value">—</div>
</div>

<div class="weather-item">
<div id="humidityLabel" class="weather-label"></div>
<div id="weatherHumidity" class="weather-value">—</div>
</div>

<div class="weather-item">
<div id="rainLabel" class="weather-label"></div>
<div id="weatherRain" class="weather-value">—</div>
</div>

<div class="weather-item">
<div id="windLabel" class="weather-label"></div>
<div id="weatherWind" class="weather-value">—</div>
</div>
</div>

<div class="weather-item" style="margin-top:10px">
<div id="conditionLabel" class="weather-label"></div>
<div id="weatherCondition" class="weather-condition">—</div>
</div>

<div id="weatherAlert" class="weather-alert" hidden>
<strong id="alertTitle"></strong>
<div id="weatherAlertText"></div>
</div>

<div id="forecast" class="forecast"></div>
<div class="small" id="weatherUpdated"></div>
</div>
</section>

<section class="card">

<label id="languageLabel" for="language"></label>

<select id="language">
<option value="en" selected>English</option>
<option value="bn">বাংলা</option>
<option value="hi">हिन्दी</option>
<option value="ta">தமிழ்</option>
<option value="pa">ਪੰਜਾਬੀ</option>
<option value="te">తెలుగు</option>
</select>

<label id="cropLabel" for="crop"></label>

<select id="crop">
<option value="rice">Rice</option>
<option value="peanut">Peanut</option>
<option value="vegetables">Vegetables</option>
<option value="flowers">Flowers</option>
</select>

<label id="photoLabel"></label>

<div class="photo-actions">
<button id="cameraButton" class="photo-button" type="button"></button>
<button id="galleryButton" class="photo-button" type="button"></button>
</div>

<input id="cameraInput" class="hidden-file" type="file" accept="image/*" capture="environment">
<input id="galleryInput" class="hidden-file" type="file" accept="image/*">

<div id="selectedFile" class="selected-file"></div>

<img id="photoPreview" class="photo-preview" hidden alt="Selected crop photo preview">

<button id="record" class="record" type="button"></button>

<div id="status" class="status"></div>

<p id="photoHint" class="hint"></p>

</section>

<section id="resultCard" class="card" hidden>
<strong id="adviceTitle"></strong>
<div id="result" class="result"></div>
<span id="safety" class="safety"></span>
<audio id="audio" controls></audio>
<div id="vision" class="small"></div>
<div id="details" class="small"></div>
</section>

</main>

0:'ਸਾਫ਼ ਆਸਮਾਨ',1:'ਮੁੱਖ ਤੌਰ ਤੇ ਸਾਫ਼',2:'ਅੰਸ਼ਿਕ ਬੱਦਲ',3:'ਬੱਦਲ ਛਾਏ ਹੋਏ',45:'ਧੁੰਦ',48:'ਧੁੰਦ',51:'ਹਲਕੀ ਫੁਹਾਰ',53:'ਦਰਮਿਆਨੀ ਫੁਹਾਰ',55:'ਘਣੀ ਫੁਹਾਰ',61:'ਹਲਕੀ ਬਾਰਿਸ਼',63:'ਦਰਮਿਆਨੀ ਬਾਰਿਸ਼',65:'ਭਾਰੀ ਬਾਰਿਸ਼',71:'ਹਲਕੀ ਬਰਫ਼ਬਾਰੀ',73:'ਦਰਮਿਆਨੀ ਬਰਫ਼ਬਾਰੀ',75:'ਭਾਰੀ ਬਰਫ਼ਬਾਰੀ',80:'ਹਲਕੀ ਬਾਰਿਸ਼ ਦੀਆਂ ਛਿੱਟਾਂ',81:'ਦਰਮਿਆਨੀ ਬਾਰਿਸ਼ ਦੀਆਂ ਛਿੱਟਾਂ',82:'ਤੇਜ਼ ਬਾਰਿਸ਼ ਦੀਆਂ ਛਿੱਟਾਂ',95:'ਤੂਫ਼ਾਨ',96:'ਗੜਿਆਂ ਨਾਲ ਤੂਫ਼ਾਨ',99:'ਭਾਰੀ ਗੜਿਆਂ ਨਾਲ ਤੂਫ਼ਾਨ'
},

te:{
0:'ఆకాశం నిర్మలంగా ఉంది',1:'ఎక్కువగా నిర్మలం',2:'పాక్షికంగా మేఘావృతం',3:'మేఘావృతం',45:'పొగమంచు',48:'పొగమంచు',51:'తేలికపాటి జల్లులు',53:'మోస్తరు జల్లులు',55:'భారీ జల్లులు',61:'తేలికపాటి వర్షం',63:'మోస్తరు వర్షం',65:'భారీ వర్షం',71:'తేలికపాటి మంచు',73:'మోస్తరు మంచు',75:'భారీ మంచు',80:'తేలికపాటి వర్షపు జల్లులు',81:'మోస్తరు వర్షపు జల్లులు',82:'తీవ్రమైన వర్షపు జల్లులు',95:'ఉరుములతో కూడిన వర్షం',96:'వడగళ్లతో ఉరుములు',99:'భారీ వడగళ్లతో ఉరుములు'
}

};

const cropNames={
en:{
rice:'Rice',
peanut:'Peanut',
vegetables:'Vegetables',
flowers:'Flowers'
},
bn:{
rice:'ধান',
peanut:'চিনাবাদাম',
vegetables:'সবজি',
flowers:'ফুল'
},
hi:{
rice:'धान',
peanut:'मूंगफली',
vegetables:'सब्ज़ियां',
flowers:'फूल'
},
ta:{
rice:'நெல்',
peanut:'நிலக்கடலை',
vegetables:'காய்கறிகள்',
flowers:'மலர்கள்'
},
pa:{
rice:'ਝੋਨਾ',
peanut:'ਮੂੰਗਫਲੀ',
vegetables:'ਸਬਜ਼ੀਆਂ',
flowers:'ਫੁੱਲ'
},
te:{
rice:'వరి',
peanut:'వేరుశెనగ',
vegetables:'కూరగాయలు',
flowers:'పూలు'
}
};

function t(k){
return (ui[languageEl.value]||ui.en)[k]||k
}

function setText(id,k){
document.getElementById(id).textContent=t(k)
}

function localizeCropOptions(){
const names=cropNames[languageEl.value]||cropNames.en;
Array.from(cropEl.options).forEach(option=>{
if(names[option.value]) option.textContent=names[option.value];
});
}

function getSafetyText(status){
const s=String(status||'').toLowerCase();

const maps={
en:{caution:'Caution',safe:'Safe',warning:'Warning'},
bn:{caution:'সতর্কতা',safe:'নিরাপদ',warning:'সতর্কবার্তা'},
hi:{caution:'सावधानी',safe:'सुरक्षित',warning:'चेतावनी'},
ta:{caution:'எச்சரிக்கை',safe:'பாதுகாப்பானது',warning:'எச்சரிக்கை'},
pa:{caution:'ਸਾਵਧਾਨੀ',safe:'ਸੁਰੱਖਿਅਤ',warning:'ਚੇਤਾਵਨੀ'},
te:{caution:'జాగ్రత్త',safe:'సురక్షితం',warning:'హెచ్చరిక'}
};

const map=maps[languageEl.value]||maps.en;
return map[s]||map.caution;
}

function applyLanguage(){

document.documentElement.lang=languageEl.value;

setText('tagline','tagline');
setText('weatherTitle','weatherTitle');
setText('locationStatus',lastLatitude!==null?'locationDetected':'locationNone');
setText('locationButton',lastLatitude!==null?'refreshLocation':'useLocation');
setText('weatherLoading','weatherLoading');
setText('temperatureLabel','temperature');
setText('humidityLabel','humidity');
setText('rainLabel','rain');
setText('windLabel','wind');
setText('conditionLabel','condition');
setText('alertTitle','alert');
setText('languageLabel','language');
setText('cropLabel','crop');
setText('photoLabel','photo');

cameraButton.innerHTML=t('camera');
galleryButton.innerHTML=t('gallery');

localizeCropOptions();

selectedFileEl.textContent=selectedImage
?selectedFileEl.textContent
:t('noPhoto');

recordButton.innerHTML=recording?t('release'):t('hold');

setStatus(recording?t('listening'):t('status'));

document.getElementById('photoHint').textContent=t('hint');
document.getElementById('adviceTitle').textContent=t('advice');

if(!resultCard.hidden){
safetyEl.textContent=`${t('safety')}: ${getSafetyText(dSafetyStatus)}`;
renderVision(dVision);
}

if(lastLatitude!==null&&lastLongitude!==null){
fetchWeather(lastLatitude,lastLongitude);
}

}

function setStatus(v,e=false){
statusEl.textContent=v;
statusEl.classList.toggle('error',e);
}

function openPicker(i){
i.value='';
if(i.showPicker){
try{
i.showPicker();
return
}catch(_){}
}
i.click();
}

cameraButton.onclick=()=>openPicker(cameraInput);
galleryButton.onclick=()=>openPicker(galleryInput);

function handleImageSelection(f,sourceKey){

if(!f)return;

if(!f.type.startsWith('image/')){
setStatus(t('errorImage'),true);
return;
}

selectedImage=f;

if(previewUrl)URL.revokeObjectURL(previewUrl);

previewUrl=URL.createObjectURL(f);
photoPreview.src=previewUrl;
photoPreview.hidden=false;

selectedFileEl.textContent=`${t(sourceKey)}: ${f.name}`;

[cameraButton,galleryButton].forEach(b=>b.classList.remove('selected'));

if(sourceKey==='camera')cameraButton.classList.add('selected');
if(sourceKey==='gallery')galleryButton.classList.add('selected');

setStatus(t('photoSelected'));
}

cameraInput.onchange=()=>handleImageSelection(cameraInput.files?.[0],'camera');
galleryInput.onchange=()=>handleImageSelection(galleryInput.files?.[0],'gallery');

function escapeHtml(v){
return String(v)
.replaceAll('&','&amp;')
.replaceAll('<','&lt;')
.replaceAll('>','&gt;')
.replaceAll('"','&quot;')
.replaceAll("'",'&#039;');
}

function getWeatherDescription(c){
const d=conditionNames[languageEl.value]||conditionNames.en;
return d[c]||t('condition');
}

function formatForecastDate(s){
if(!s)return t('forecast');

const d=new Date(`${s}T00:00:00`);

return Number.isNaN(d.getTime())
?s
:d.toLocaleDateString(languageEl.value,{
weekday:'short',
day:'numeric',
month:'short'
});
}

function formatWeatherTime(s){
if(!s)return'';

const d=new Date(s);

return Number.isNaN(d.getTime())
?s
:d.toLocaleString(languageEl.value,{
dateStyle:'medium',
timeStyle:'short'
});
}

function setWeatherError(m){
weatherError.textContent=m;
weatherError.hidden=false;
weatherContent.hidden=true;
}

function clearWeatherError(){
weatherError.hidden=true;
weatherError.textContent='';
}

function renderWeather(data){

const current=data.current||{};
const forecast=Array.isArray(data.forecast)?data.forecast:[];

weatherTemperature.textContent=
Number.isFinite(current.temperature_2m)
?`${current.temperature_2m} °C`
:'—';

weatherHumidity.textContent=
Number.isFinite(current.relative_humidity_2m)
?`${current.relative_humidity_2m}%`
:'—';

weatherRain.textContent=
Number.isFinite(current.rain)
?`${current.rain} mm`
:Number.isFinite(current.precipitation)
?`${current.precipitation} mm`
:'—';

weatherWind.textContent=
Number.isFinite(current.wind_speed_10m)
?`${current.wind_speed_10m} km/h`
:'—';

weatherCondition.textContent=getWeatherDescription(current.weather_code);

const alerts=Array.isArray(data.farm_alerts)
?data.farm_alerts
:(data.farm_alert?[data.farm_alert]:[]);

weatherAlertText.innerHTML='';

if(alerts.length){

weatherAlert.hidden=false;

const list=document.createElement('ul');

alerts.forEach(a=>{
const li=document.createElement('li');
li.textContent=String(a);
list.appendChild(li);
});

weatherAlertText.appendChild(list);

}else{
weatherAlert.hidden=true;
}

forecastEl.innerHTML='';

forecast.slice(0,7).forEach(day=>{

const card=document.createElement('div');
card.className='forecast-day';

const max=Number.isFinite(day.temperature_max_c)
?`${day.temperature_max_c}°`
:'—';

const min=Number.isFinite(day.temperature_min_c)
?`${day.temperature_min_c}°`
:'—';

const prob=Number.isFinite(day.precipitation_probability_max_pct)
?`${day.precipitation_probability_max_pct}%`
:'—';

const amount=Number.isFinite(day.precipitation_sum_mm)
?`${day.precipitation_sum_mm} mm`
:'—';

const wind=Number.isFinite(day.wind_speed_max_kmh)
?`${day.wind_speed_max_kmh} km/h`
:'—';

card.innerHTML=`
<div>${escapeHtml(formatForecastDate(day.date))}</div>
<div class="forecast-temp">${escapeHtml(max)} / ${escapeHtml(min)}</div>
<div>🌧 ${escapeHtml(prob)}</div>
<div>💧 ${escapeHtml(amount)}</div>
<div>💨 ${escapeHtml(wind)}</div>
`;

forecastEl.appendChild(card);

});

weatherUpdated.textContent=current.time
?`${t('updated')}: ${formatWeatherTime(current.time)}`
:t('loaded');

weatherContent.hidden=false;
}

async function fetchWeather(lat,lon){

clearWeatherError();

weatherLoading.hidden=false;
weatherContent.hidden=true;

lastLatitude=lat;
lastLongitude=lon;

const language=languageEl.value;

const url=
`${API_BASE}/api/v1/weather?latitude=${encodeURIComponent(lat)}&longitude=${encodeURIComponent(lon)}&language=${encodeURIComponent(language)}&forecast_days=7`;

try{

const r=await fetch(url);
const d=await r.json();

if(!r.ok){
throw new Error(d.detail||d.message||t('weatherServiceError'));
}

renderWeather(d);

locationStatus.textContent=
`📍 ${Number(lat).toFixed(4)}, ${Number(lon).toFixed(4)}`;

}catch(e){

setWeatherError(e.message||t('weatherUnavailable'));

}finally{

weatherLoading.hidden=true;

}

}

function getCurrentLocation(){

if(!navigator.geolocation){
setWeatherError(t('locationUnsupported'));
return;
}

clearWeatherError();

locationButton.disabled=true;
locationButton.innerHTML=t('gettingLocation');

weatherLoading.hidden=false;
weatherContent.hidden=true;

navigator.geolocation.getCurrentPosition(

p=>{

const{latitude,longitude}=p.coords;

locationStatus.textContent=`📍 ${t('locationDetected')}`;

locationButton.disabled=false;
locationButton.innerHTML=t('refreshLocation');

fetchWeather(latitude,longitude);

},

e=>{

locationButton.disabled=false;
locationButton.innerHTML=t('useLocation');
weatherLoading.hidden=true;

let m=t('locationUnable');

if(e.code===1)m=t('locationDenied');
else if(e.code===2)m=t('locationUnknown');
else if(e.code===3)m=t('locationTimeout');

setWeatherError(m);

},

{
enableHighAccuracy:true,
timeout:15000,
maximumAge:300000
}

);
}

locationButton.onclick=getCurrentLocation;

let dSafetyStatus='',
dVision=null;

function renderVision(v){

dVision=v;

if(!v){
visionEl.textContent='';
return;
}

const o=Array.isArray(v.observations)?v.observations:[];
const c=Array.isArray(v.possible_causes)?v.possible_causes:[];

let text=`${t('vision')}: ${o.join(' ')}`;

if(c.length){
text+=` ${t('causes')}: ${c.join(', ')}.`;
}

visionEl.textContent=text;
}

languageEl.addEventListener('change',applyLanguage);

async function startRecording(e){

if(recording)return;

recording=true;
activePointerId=e.pointerId;

try{

if(recordButton.setPointerCapture){
recordButton.setPointerCapture(e.pointerId);
}

if(!navigator.mediaDevices?.getUserMedia){
throw new Error(t('microphoneUnsupported'));
}

stream=await navigator.mediaDevices.getUserMedia({
audio:true
});

chunks=[];

const types=[
'audio/webm;codecs=opus',
'audio/webm',
'audio/ogg;codecs=opus'
];

const mime=types.find(t=>MediaRecorder.isTypeSupported(t))||'';

recorder=new MediaRecorder(
stream,
mime?{mimeType:mime}:undefined
);

recorder.ondataavailable=x=>{
if(x.data?.size)chunks.push(x.data);
};

recorder.onstop=sendRecording;

recorder.start(250);

recordButton.classList.add('recording');
recordButton.innerHTML=t('release');

setStatus(t('listening'));

}catch(err){

recording=false;
activePointerId=null;

stream?.getTracks().forEach(t=>t.stop());
stream=null;

setStatus(
err.message||t('microphonePermission'),
true
);

}

}

function stopRecording(e){

if(!recording)return;

if(
e&&
activePointerId!==null&&
e.pointerId!==activePointerId
)return;

recording=false;
activePointerId=null;

if(
recorder&&
recorder.state!=='inactive'
){
recorder.stop();
}

stream?.getTracks().forEach(t=>t.stop());
stream=null;

recordButton.classList.remove('recording');
recordButton.innerHTML=t('hold');

setStatus(t('processing'));

}

async function sendRecording(){

try{

const type=recorder?.mimeType||'audio/webm';

const blob=new Blob(chunks,{
type
});

const ext=
type.includes('ogg')
?'ogg'
:type.includes('mp4')
?'m4a'
:'webm';

const form=new FormData();

form.append(
'file',
blob,
`farmer-question.${ext}`
);

form.append(
'language',
languageEl.value
);

form.append(
'crop_category',
cropEl.value
);

const cropName = cropEl.value === 'rice' ? 'Rice' : cropEl.value === 'peanut' ? 'Peanut' : cropEl.value === 'vegetables' ? 'Vegetables' : 'Flowers';
form.append('crop_name', cropName);

const image=selectedImage;

const endpoint=image
?'/api/v1/voice/vision-advisory'
:'/api/v1/voice/advisory';

if(image){
form.append(
'image',
image,
image.name
);
}

const r=await fetch(
`${API_BASE}${endpoint}`,
{
method:'POST',
body:form
}
);

const d=await r.json();

if(!r.ok){
throw new Error(
d.detail||t('processingError')
);
}

resultCard.hidden=false;

document.getElementById('adviceTitle').textContent=t('advice');

resultEl.textContent=
d.advisory?.answer||t('noAdvisory');

dSafetyStatus=
d.advisory?.safety?.status||'caution';

safetyEl.textContent=
`${t('safety')}: ${getSafetyText(dSafetyStatus)}`;

const detectedCrop=
cropNames[languageEl.value]?.[
d.understanding?.detected_crop
]||
d.understanding?.detected_crop||
t('notSpecified');

detailsEl.textContent=
`${t('detected')}: ${detectedCrop} · ${t('confidence')}: ${d.advisory?.confidence||'low'}`;

dVision=d.vision||null;

renderVision(dVision);

if(d.audio?.base64){

audioEl.src=
`data:${d.audio.mime_type};base64,${d.audio.base64}`;

audioEl.play().catch(()=>{});

}

setStatus(
image
?t('visionReady')
:t('ready')
);

}catch(e){

setStatus(
e.message||t('somethingWrong'),
true
);

}finally{

recorder=null;
chunks=[];

}

}

recordButton.addEventListener(
'pointerdown',
e=>{
e.preventDefault();
startRecording(e);
}
);

recordButton.addEventListener(
'pointerup',
e=>{
e.preventDefault();
stopRecording(e);
}
);

recordButton.addEventListener(
'pointercancel',
stopRecording
);

recordButton.addEventListener(
'lostpointercapture',
e=>{
if(recording)stopRecording(e);
}
);

window.addEventListener(
'pointerup',
stopRecording
);

window.addEventListener(
'pointercancel',
stopRecording
);

applyLanguage();

</script>
</body>
</html>
